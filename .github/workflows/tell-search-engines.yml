# After each production deploy, tells Bing and the other search engines that share IndexNow which pages changed,
# so they fetch them now instead of whenever they next pass by. ChatGPT's search leans on Bing's index.
# See .github/scripts/tell_search_engines.py.
#
# Runs when the Deploy workflow (deploy.yml, which puts main on the Mumbai VM) finishes well. "Run workflow" on the
# Actions tab sends every page in the sitemap instead, which is how the first list was sent.
name: Tell search engines

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Send every page in the sitemap, not only the changed ones"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: tell-search-engines
  cancel-in-progress: false

jobs:
  tell:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send every page
        if: github.event_name == 'workflow_dispatch' && inputs.all
        run: python3 .github/scripts/tell_search_engines.py --all

      # The deploy before this one is the newest earlier Deploy run that finished well. Before the first of those,
      # it is the last production deploy GitHub has on record (Vercel's, until November 2026).
      - name: Send the pages this deploy changed
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          THIS_RUN: ${{ github.event.workflow_run.id }}
          THIS_MADE: ${{ github.event.workflow_run.created_at }}
          THIS_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          base=$(gh run list --workflow deploy.yml --branch main --status success --limit 30 \
                   --json databaseId,headSha,createdAt \
                   --jq "map(select(.databaseId != $THIS_RUN and .createdAt < \"$THIS_MADE\")) | .[0].headSha // empty")
          if [ -z "$base" ]; then
            for id in $(gh api "repos/$GH_REPO/deployments?environment=Production&per_page=30" \
                          --jq ".[] | select(.created_at < \"$THIS_MADE\") | .id"); do
              if [ "$(gh api "repos/$GH_REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state')" = "success" ]; then
                base=$(gh api "repos/$GH_REPO/deployments/$id" --jq .sha)
                break
              fi
            done
          fi
          if [ -z "$base" ] || [ "$base" = "$THIS_SHA" ]; then
            echo "No earlier production deploy to compare with, so there is nothing to send."
            exit 0
          fi
          echo "Comparing $base with $THIS_SHA"
          python3 .github/scripts/tell_search_engines.py "$base" "$THIS_SHA"
